name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"

      # The plugins/ mirror + marketplace.json are generated from skills/ + bundles.json.
      # Fail if someone edited a skill or bundles.json without re-running the sync.
      - name: Generated mirror is in sync
        run: node scripts/sync-bundles.mjs --check

      # Confirm skills are still discoverable with descriptions across CLI agents.
      - name: Skills discoverable via npx skills
        run: npx --yes skills@1.5.16 add . --list
